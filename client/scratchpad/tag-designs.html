<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clipboard tag designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300..800&family=Forum&display=swap" />
<style>
  /* Same tokens as src/index.css, plus one oxblood for the Crimson tag's shade. */
  :root {
    --ink: #000;
    --smoke: #111;
    --raised: #1a1a1a;
    --paper: #f3efe6;
    --paper-dim: #e6e0d3;
    --mute: #9a958c;
    --ink-mute: #6e685e;
    --crimson: #b3122e;
    --crimson-bright: #e0475c;
    --oxblood: #7d0c20;
    --display: "Forum", Georgia, serif;
    --sans: "Jost", system-ui, sans-serif;
    --cut: 44px; /* how far down the cut corners run */
  }
  * { box-sizing: border-box; }
  html { background: var(--ink); color: var(--paper); color-scheme: dark; -webkit-font-smoothing: antialiased; }
  body { margin: 0; font-family: var(--sans); }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--crimson-bright); outline-offset: 3px; }

  .page { max-width: 1240px; margin: 0 auto; padding: 56px 24px 120px; }
  .page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 40px; }
  .page-head h1 { font: 400 clamp(44px, 6vw, 72px)/1 var(--display); margin: 0; letter-spacing: -0.01em; }
  .page-head p { max-width: 44ch; margin: 0; color: var(--mute); line-height: 1.6; }

  .jump { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 32px; }
  .jump a { padding: 8px 16px; border-radius: 999px; background: var(--raised); color: var(--mute); font-size: 14px; transition: color .2s, background .2s; }
  .jump a:hover { color: var(--paper); background: #262626; }

  .design { padding-top: 96px; scroll-margin-top: 16px; }
  .design-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 8px 40px; align-items: baseline; border-top: 1px solid rgb(243 239 230 / .12); padding-top: 24px; }
  .design-head h2 { font: 400 44px/1 var(--display); margin: 0; }
  .design-head h2 small { font: 400 15px var(--sans); color: var(--mute); margin-left: 12px; letter-spacing: 0; }
  .design-head p { margin: 0; color: var(--mute); line-height: 1.6; max-width: 60ch; }
  @media (max-width: 760px) { .design-head { grid-template-columns: 1fr; } }

  /* The rail the tags hang from, as on the site. */
  .rack { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 28px; margin-top: 40px; }
  .rack::before { content: ""; position: absolute; left: -12px; right: -12px; top: 0; height: 4px; border-radius: 2px; background: #2a2a2a; }
  @media (max-width: 900px) { .rack { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px) { .rack { grid-template-columns: minmax(0, 1fr); gap: 40px; } }

  /* ---------- Shared tag skeleton: loop, eyelet, cut corners, swing ---------- */
  .hang { position: relative; max-width: 360px; margin: 0 auto; width: 100%; user-select: none; }
  .swing { position: relative; transform-origin: top center; padding-top: 40px; will-change: transform; }
  .loop { position: absolute; left: 50%; top: 0; z-index: 3; width: 20px; height: 62px; transform: translateX(-50%); overflow: visible; }
  .loop path { fill: none; stroke: var(--crimson); stroke-width: 1.75; stroke-linecap: round; }
  .tag { position: relative; border-radius: 0 0 16px 16px; clip-path: polygon(22% 0, 78% 0, 100% var(--cut), 100% 100%, 0 100%, 0 var(--cut)); }
  .eyelet { position: absolute; left: 50%; top: 14px; width: 14px; height: 14px; transform: translateX(-50%); border-radius: 50%; background: var(--ink); z-index: 2; }

  /* The photos are 4:5 with the product name printed along the bottom; this window shows
     the band from 10% to 82%: the whole garment, not the printed name (as in ProductCard). */
  .photo { position: relative; display: block; aspect-ratio: 1 / .9; overflow: hidden; background: var(--paper-dim); }
  .photo img { position: absolute; left: 0; right: 0; top: -14%; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; transition: transform .7s ease-out; }
  .hang:hover .photo img { transform: scale(1.04); }

  .name { font: 400 26px/1.12 var(--display); margin: 0; min-height: 2.24em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance; }
  .price { font: 600 26px/1.1 var(--sans); font-variant-numeric: tabular-nums; margin: 0; letter-spacing: -0.01em; }
  .small { font-size: 12px; }
  .row { display: flex; align-items: end; justify-content: space-between; gap: 12px; }
  .actions { display: flex; gap: 8px; }
  .view { flex: 1; display: flex; align-items: center; justify-content: space-between; border-radius: 10px; padding: 12px 16px; font-weight: 600; transition: filter .2s, background .2s, color .2s; }
  .view svg { width: 20px; height: 20px; transition: transform .3s; }
  .view:hover svg { transform: translateX(4px); }
  .heart { width: 48px; flex-shrink: 0; display: grid; place-items: center; border-radius: 10px; border: 0; background: transparent; transition: background .2s; }
  .heart svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; transition: transform .2s; }
  .heart[aria-pressed="true"] svg { transform: scale(1.1); fill: var(--heart-fill, var(--crimson)); stroke: var(--heart-fill, var(--crimson)); }

  /* ---------- 0. Current (reference) ---------- */
  .t-current .swing { filter: drop-shadow(0 18px 28px rgb(0 0 0 / .55)); }
  .t-current .tag { background: var(--paper); color: var(--ink); padding: 40px 14px 16px; }
  .t-current .eyelet { box-shadow: 0 0 0 4px var(--paper-dim); }
  .t-current .brand { font: 400 20px/1 var(--display); }
  .t-current .cat { font-size: 11px; text-transform: uppercase; letter-spacing: .16em; color: var(--ink-mute); }
  .t-current .photo { margin-top: 10px; border-radius: 10px; }
  .t-current .tear { position: relative; margin: 16px -14px; border-top: 2px dashed rgb(0 0 0 / .2); }
  .t-current .tear::before, .t-current .tear::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); }
  .t-current .tear::before { left: -10px; } .t-current .tear::after { right: -10px; }
  .t-current .lbl { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-mute); }
  .t-current .name { margin-top: 4px; }
  .t-current .row { margin-top: 12px; }
  .t-current .mono { font: 11px ui-monospace, Menlo, monospace; letter-spacing: .06em; color: var(--ink-mute); padding-bottom: 2px; }
  .t-current .actions { margin-top: 16px; }
  .t-current .view { background: var(--crimson); color: var(--paper); }
  .t-current .view:hover { filter: brightness(1.1); }
  .t-current .heart { box-shadow: inset 0 0 0 1.5px rgb(0 0 0 / .2); color: var(--ink); }

  /* ---------- 1. Noir: black tag, crimson foil edge ---------- */
  .t-noir .tag { background: var(--crimson); padding: 1.5px; }
  .t-noir .inner { position: relative; border-radius: 0 0 15px 15px; background: #070707; padding: 40px 16px 18px;
    clip-path: polygon(calc(22% + .6px) 0, calc(78% - .6px) 0, 100% calc(var(--cut) + .4px), 100% 100%, 0 100%, 0 calc(var(--cut) + .4px)); }
  .t-noir .eyelet { background: var(--ink); box-shadow: 0 0 0 3px var(--crimson), 0 0 0 5px #070707, 0 0 0 6px rgb(179 18 46 / .45); }
  .t-noir .top { display: flex; justify-content: space-between; align-items: baseline; }
  .t-noir .brand { font: 400 21px/1 var(--display); color: var(--paper); }
  .t-noir .cat { font-size: 13px; color: var(--mute); }
  .t-noir .photo { margin-top: 12px; border-radius: 8px; }
  .t-noir .name { color: var(--paper); margin-top: 18px; }
  .t-noir .row { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgb(243 239 230 / .1); }
  .t-noir .price { color: var(--crimson-bright); }
  .t-noir .tax { color: var(--mute); margin-top: 2px; }
  .t-noir .actions { margin-top: 16px; }
  .t-noir .view { background: var(--crimson); color: var(--paper); }
  .t-noir .view:hover { filter: brightness(1.12); }
  .t-noir .heart { color: var(--paper); box-shadow: inset 0 0 0 1.5px rgb(243 239 230 / .2); }
  .t-noir .heart:hover { background: rgb(243 239 230 / .06); }
  .t-noir { --heart-fill: var(--crimson-bright); }

  /* ---------- 2. Crimson: solid red card, cream mat ---------- */
  .t-crimson .swing { filter: drop-shadow(0 20px 30px rgb(0 0 0 / .6)); }
  .t-crimson .tag { background: linear-gradient(180deg, var(--crimson) 0%, #a10f28 100%); color: var(--paper); padding: 42px 16px 18px; }
  .t-crimson .eyelet { background: var(--ink); box-shadow: 0 0 0 4px var(--oxblood); }
  .t-crimson .brand { text-align: center; font: 400 22px/1 var(--display); letter-spacing: .02em; }
  .t-crimson .photo { margin-top: 14px; border-radius: 4px; box-shadow: 0 0 0 6px var(--paper); }
  .t-crimson .meta { margin-top: 22px; display: flex; justify-content: space-between; font-size: 13px; color: rgb(243 239 230 / .72); }
  .t-crimson .name { margin-top: 4px; }
  .t-crimson .rule { margin: 14px 0 12px; border: 0; border-top: 1px solid rgb(243 239 230 / .25); }
  .t-crimson .price { font-size: 28px; }
  .t-crimson .tax { color: rgb(243 239 230 / .72); }
  .t-crimson .actions { margin-top: 16px; }
  .t-crimson .view { background: var(--ink); color: var(--paper); }
  .t-crimson .view:hover { background: #1c1c1c; }
  .t-crimson .heart { color: var(--paper); box-shadow: inset 0 0 0 1.5px rgb(243 239 230 / .4); }
  .t-crimson .heart:hover { background: rgb(0 0 0 / .15); }
  .t-crimson { --heart-fill: var(--paper); }

  /* ---------- 3. Stub: full-bleed photo, crimson tear-off stub ---------- */
  .t-stub .swing { filter: drop-shadow(0 18px 28px rgb(0 0 0 / .55)); }
  .t-stub .tag { background: #1b1b1b; color: var(--paper); }
  .t-stub .eyelet { box-shadow: 0 0 0 4px #2c2c2c; }
  .t-stub .head { display: flex; justify-content: space-between; align-items: baseline; padding: 40px 16px 12px; }
  .t-stub .brand { font: 400 20px/1 var(--display); }
  .t-stub .cat { font-size: 13px; color: var(--mute); }
  .t-stub .photo { aspect-ratio: 1 / .95; }
  .t-stub .body { padding: 16px 16px 20px; }
  .t-stub .stub { position: relative; background: var(--crimson); padding: 18px 16px 18px; border-radius: 0 0 16px 16px; }
  /* Perforation: a row of punched holes across the join, with notches at each edge. */
  .t-stub .stub::before { content: ""; position: absolute; left: 0; right: 0; top: -3px; height: 6px;
    background: radial-gradient(circle, var(--ink) 2px, transparent 2.5px) 0 0 / 12px 6px repeat-x; }
  .t-stub .notch { position: absolute; top: -10px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); }
  .t-stub .notch.l { left: -10px; } .t-stub .notch.r { right: -10px; }
  .t-stub .stub .row { align-items: center; }
  .t-stub .tax { color: rgb(243 239 230 / .75); }
  .t-stub .actions { margin-top: 14px; }
  .t-stub .view { background: var(--paper); color: var(--ink); }
  .t-stub .view:hover { background: #fff; }
  .t-stub .heart { color: var(--paper); box-shadow: inset 0 0 0 1.5px rgb(243 239 230 / .45); }
  .t-stub .heart:hover { background: rgb(0 0 0 / .15); }
  .t-stub { --heart-fill: var(--paper); }

  /* ---------- 4. Deco: centered, double-rule frame, logo stamp ---------- */
  .t-deco .tag { background: #080808; color: var(--paper); padding: 10px; }
  .t-deco .eyelet { top: 16px; box-shadow: 0 0 0 1px var(--paper), 0 0 0 4px #080808, 0 0 0 5px rgb(243 239 230 / .5); }
  /* Two hairlines inset from the die-cut edge, echoing the inline strokes in the logo's
     O, R and D. Drawn by drawFrames() below so they follow the cut corners. */
  .t-deco .frame { position: relative; padding: 42px 14px 16px; text-align: center; }
  .t-deco .outline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .t-deco .outline path { fill: none; stroke: var(--paper); stroke-width: 1; }
  .t-deco .outline path + path { opacity: .45; }
  .t-deco .stamp { display: block; margin: 4px auto 0; width: 92px; aspect-ratio: 1000 / 643; background: var(--paper);
    -webkit-mask: url(logo.svg) center / contain no-repeat; mask: url(logo.svg) center / contain no-repeat; }
  .t-deco .photo { margin: 16px 6px 0; border-radius: 999px 999px 6px 6px; aspect-ratio: 1 / 1.02; }
  .t-deco .photo img { top: -1%; }
  .t-deco .cat { margin-top: 18px; font-size: 13px; color: var(--mute); letter-spacing: .04em; }
  .t-deco .name { margin: 4px auto 0; max-width: 16ch; }
  .t-deco .pricebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; margin-top: 12px; }
  .t-deco .pricebar::before, .t-deco .pricebar::after { content: ""; height: 1px; background: linear-gradient(90deg, transparent, var(--crimson-bright)); }
  .t-deco .pricebar::after { transform: scaleX(-1); }
  .t-deco .price { color: var(--paper); font-weight: 500; }
  .t-deco .tax { color: var(--mute); margin-top: 4px; }
  .t-deco .actions { margin: 16px 6px 0; }
  .t-deco .view { justify-content: center; gap: 10px; background: transparent; color: var(--paper); box-shadow: inset 0 0 0 1px var(--crimson-bright); }
  .t-deco .view:hover { background: var(--crimson); box-shadow: inset 0 0 0 1px var(--crimson); }
  .t-deco .heart { color: var(--paper); box-shadow: inset 0 0 0 1px rgb(243 239 230 / .3); }
  .t-deco .heart:hover { background: rgb(243 239 230 / .06); }
  .t-deco { --heart-fill: var(--crimson-bright); }

  /* ---------- Deco family: shared frame, stamp and rules ---------- */
  .deco-family .tag { padding: 10px; }
  .deco-family .frame { position: relative; padding: 42px 14px 16px; text-align: center; }
  .deco-family .outline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .deco-family .outline path { fill: none; stroke-width: 1; }
  .deco-family .stamp { position: relative; display: block; margin: 4px auto 0; width: 92px; aspect-ratio: 1000 / 643;
    -webkit-mask: url(logo.svg) center / contain no-repeat; mask: url(logo.svg) center / contain no-repeat; }
  .deco-family .name { margin: 4px auto 0; max-width: 16ch; }
  .deco-family .tax { margin-top: 4px; }
  .deco-family .actions { margin: 16px 6px 0; }
  .deco-family .view { justify-content: center; gap: 10px; }

  /* ---------- 6. Sunburst: crimson, cream frame, rays behind an arch ---------- */
  .t-sunburst .swing { filter: drop-shadow(0 20px 30px rgb(0 0 0 / .6)); }
  .t-sunburst .tag { background: radial-gradient(120% 70% at 50% 38%, #c0163a 0%, var(--crimson) 45%, #8f0d24 100%); color: var(--paper); }
  .t-sunburst .eyelet { top: 16px; box-shadow: 0 0 0 1px var(--paper), 0 0 0 4px var(--crimson), 0 0 0 5px rgb(243 239 230 / .55); }
  .t-sunburst .outline path { stroke: var(--paper); }
  .t-sunburst .outline path + path { opacity: .5; }
  .t-sunburst .stamp { background: var(--paper); }
  /* The fan of rays rises from behind the arch, like a Deco sunrise. */
  .t-sunburst .sun { position: relative; margin-top: 10px; padding: 30px 30px 0; }
  .t-sunburst .sun::before { content: ""; position: absolute; left: -14px; right: -14px; top: 0; bottom: 35%;
    background: repeating-conic-gradient(from -90deg at 50% 100%, rgb(243 239 230 / .3) 0deg 1.6deg, transparent 1.6deg 7deg);
    -webkit-mask: radial-gradient(70% 100% at 50% 100%, #000 55%, transparent 100%); mask: radial-gradient(70% 100% at 50% 100%, #000 55%, transparent 100%); }
  .t-sunburst .photo { border-radius: 999px 999px 4px 4px; aspect-ratio: 1 / 1.02; box-shadow: 0 0 0 5px var(--paper); }
  .t-sunburst .photo img { top: -1%; }
  .t-sunburst .cat { margin-top: 20px; font-size: 13px; color: rgb(243 239 230 / .75); letter-spacing: .04em; }
  .t-sunburst .pricebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-top: 12px; }
  .t-sunburst .pricebar::before, .t-sunburst .pricebar::after { content: ""; height: 5px;
    border-top: 1px solid rgb(243 239 230 / .6); border-bottom: 1px solid rgb(243 239 230 / .6); }
  .t-sunburst .price { font-weight: 500; }
  .t-sunburst .tax { color: rgb(243 239 230 / .75); }
  .t-sunburst .view { background: var(--ink); color: var(--paper); }
  .t-sunburst .view:hover { background: #1c1c1c; }
  .t-sunburst .heart { color: var(--paper); box-shadow: inset 0 0 0 1px rgb(243 239 230 / .5); }
  .t-sunburst .heart:hover { background: rgb(0 0 0 / .15); }
  .t-sunburst { --heart-fill: var(--paper); }

  /* ---------- 7. Ziggurat: stepped window, stepped ornaments, capitals ---------- */
  .t-ziggurat .tag { background: #080808; color: var(--paper); }
  .t-ziggurat .eyelet { top: 16px; box-shadow: 0 0 0 1px var(--crimson-bright), 0 0 0 4px #080808, 0 0 0 5px rgb(224 71 92 / .5); }
  .t-ziggurat .outline path { stroke: var(--crimson-bright); }
  .t-ziggurat .outline path + path { stroke: var(--paper); opacity: .3; }
  .t-ziggurat .stamp { background: var(--paper); }
  /* The window steps up to the centre like a Deco skyline; the crimson layer behind shows as its edge. */
  .t-ziggurat .steps { margin: 18px 6px 0; padding: 1.5px; background: var(--crimson-bright);
    clip-path: polygon(0 34px, 14% 34px, 14% 17px, 28% 17px, 28% 0, 72% 0, 72% 17px, 86% 17px, 86% 34px, 100% 34px, 100% 100%, 0 100%); }
  .t-ziggurat .photo { aspect-ratio: 1 / .98;
    clip-path: polygon(0 33px, calc(14% + 1.5px) 33px, calc(14% + 1.5px) 16px, calc(28% + 1.5px) 16px, calc(28% + 1.5px) 0, calc(72% - 1.5px) 0, calc(72% - 1.5px) 16px, calc(86% - 1.5px) 16px, calc(86% - 1.5px) 33px, 100% 33px, 100% 100%, 0 100%); }
  .t-ziggurat .photo img { top: -3%; }
  .t-ziggurat .ornament { display: block; width: 86px; height: 12px; margin: 16px auto 0; }
  .t-ziggurat .ornament path { fill: none; stroke: var(--crimson-bright); stroke-width: 1.2; }
  .t-ziggurat .name { margin-top: 12px; font-size: 21px; line-height: 1.25; text-transform: uppercase; letter-spacing: .12em; max-width: 18ch; }
  .t-ziggurat .cat { margin: 6px 0 0; font-size: 13px; color: var(--mute); }
  .t-ziggurat .pricebar { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
  .t-ziggurat .pricebar svg { width: 22px; height: 12px; }
  .t-ziggurat .pricebar path { fill: var(--crimson-bright); }
  .t-ziggurat .price { font-weight: 500; }
  .t-ziggurat .tax { color: var(--mute); }
  .t-ziggurat .view { background: var(--crimson); color: var(--paper); border-radius: 2px; }
  .t-ziggurat .view:hover { filter: brightness(1.12); }
  .t-ziggurat .heart { color: var(--paper); border-radius: 2px; box-shadow: inset 0 0 0 1px rgb(243 239 230 / .3); }
  .t-ziggurat .heart:hover { background: rgb(243 239 230 / .06); }
  .t-ziggurat { --heart-fill: var(--crimson-bright); }

  /* ---------- 8. Octagon: cut-corner window, watermark, price pill ---------- */
  .t-octagon .tag { background: #0a0a0a; color: var(--paper); overflow: hidden; }
  .t-octagon .eyelet { top: 16px; background: var(--crimson); box-shadow: 0 0 0 3px #0a0a0a, 0 0 0 4px var(--crimson-bright); }
  .t-octagon .outline path { stroke: var(--crimson-bright); }
  .t-octagon .outline path + path { opacity: .45; }
  .t-octagon .stamp { background: var(--paper); }
  /* The whole wordmark, huge and faint, sits behind the lower half of the tag. */
  .t-octagon .watermark { position: absolute; left: -12%; right: -12%; bottom: 60px; aspect-ratio: 1000 / 643; background: var(--paper); opacity: .028;
    -webkit-mask: url(logo.svg) center / contain no-repeat; mask: url(logo.svg) center / contain no-repeat; pointer-events: none; }
  /* Three nested octagons: a crimson line, a black gap, a finer crimson line, then the photo. */
  .t-octagon .oct { --c: 26px; margin: 18px 6px 0; padding: 1.5px; background: var(--crimson-bright); }
  .t-octagon .oct, .t-octagon .oct > *, .t-octagon .oct .photo {
    clip-path: polygon(var(--c) 0, calc(100% - var(--c)) 0, 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, 0 calc(100% - var(--c)), 0 var(--c)); }
  .t-octagon .oct > .gap { --c: 25.4px; padding: 4px; background: #0a0a0a; }
  .t-octagon .oct > .gap > .fine { --c: 23.7px; padding: 1px; background: rgb(224 71 92 / .6); }
  .t-octagon .photo { --c: 23.3px; aspect-ratio: 1 / .92; }
  .t-octagon .cat { position: relative; margin-top: 18px; font-size: 13px; color: var(--mute); letter-spacing: .04em; }
  .t-octagon .name { position: relative; }
  .t-octagon .pill { position: relative; display: inline-grid; margin-top: 12px; padding: 6px 22px 5px; border-radius: 999px;
    box-shadow: inset 0 0 0 1px var(--crimson-bright), 0 0 0 3px #0a0a0a, 0 0 0 4px rgb(224 71 92 / .45); }
  .t-octagon .price { font-weight: 500; font-size: 24px; }

  .t-octagon .heart { color: var(--paper); box-shadow: inset 0 0 0 1px rgb(243 239 230 / .35); }
  .t-octagon .heart:hover { background: rgb(243 239 230 / .06); }

  /* ---------- 5. Retail: price sticker, size run, barcode ---------- */
  .t-retail .swing { filter: drop-shadow(0 18px 28px rgb(0 0 0 / .55)); }

<body>
<main class="page">
  <header class="page-head">
    <h1>Tag designs</h1>

<script>

const LABELS = { Tshirt: 'T-shirt', 'Sweat Shirt': 'Sweatshirt', Joggers: 'Joggers' }
const rupees = (n) => `₹${Number(n).toLocaleString('en-IN')}`
const sku = (id) => id.slice(-6).toUpperCase()
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

const LOOP = `<svg class="loop" viewBox="0 0 20 62" aria-hidden="true"><path d="M8 62 L7.2 7 Q10 -2.2 12.8 7 L12 62"/></svg>`
const ARROW = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`
const HEART = `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg>`
const STEP = `<svg viewBox="0 0 22 12" aria-hidden="true"><path d="M0 5.4h12v1.2H0zM17 2l4 4-4 4-4-4z"/></svg>`
const photo = (p, inner = '') => `<a href="#" class="photo" tabindex="-1" aria-hidden="true">${inner || `<img src="${p.image}" alt="" loading="lazy" draggable="false">`}</a>`
const actions = (p, view = 'View') => `<div class="actions">

// A barcode drawn from the product id, so each tag's is different but stable.
function barcode(id) {
  let x = 0, rects = ''
  for (const ch of id) {
    const n = parseInt(ch, 16)
    const w = 1 + (n % 3), gap = 1 + ((n >> 2) % 2)
    rects += `<rect x="${x}" y="0" width="${w}" height="26"/>`
    x += w + gap
  }
  return `<svg class="bars" viewBox="0 0 ${x} 26" preserveAspectRatio="none" aria-hidden="true">${rects}</svg>`
}

const DESIGNS = [
  {

    tag: (p) => `<div class="tag"><div class="inner"><span class="eyelet"></span>
      <div class="top"><span class="brand mono" role="img" aria-label="Clipboard"></span><span class="cat">${LABELS[p.category]}</span></div>

      <h3 class="name">${esc(p.name)}</h3>

      ${actions(p)}</div></div>`,
  },
  {
    key: 'crimson', title: 'Crimson', note: 'solid red card, cream mat',
    blurb: 'The whole tag is the brand red, with the photo set in a cream mat like a print. A black eyelet and a black View button tie it back to the page. The boldest option: a wall of these makes the catalogue read as red and black at a glance.',
    tag: (p) => `<div class="tag"><span class="eyelet"></span>
      <span class="brand mono" role="img" aria-label="Clipboard"></span>
      ${photo(p)}
      <div class="meta"><span>${LABELS[p.category]}</span><span>No. ${sku(p._id)}</span></div>
      <h3 class="name">${esc(p.name)}</h3>

      <p class="price">${rupees(p.price)}</p><p class="small tax" style="margin:2px 0 0">Incl. of all taxes</p>

    key: 'stub', title: 'Stub', note: 'full-bleed photo, red tear-off',
    blurb: 'A black tag with the photo running edge to edge, then a perforated line down to a crimson stub that holds the price and the buttons, like the tear-off on a ticket. The price and actions always sit in the same red block, so they are easy to find across a grid.',
    tag: (p) => `<div class="tag"><span class="eyelet"></span>
      <div class="head"><span class="brand mono" role="img" aria-label="Clipboard"></span><span class="cat">${LABELS[p.category]}</span></div>

        ${actions(p)}</div></div>`,

      <span class="stamp" role="img" aria-label="Clipboard"></span>

    blurb: 'Deco on the brand red. The same double frame and monogram stamp, now in cream, with a fan of rays rising behind an arched window in a cream mat, the classic Deco sunrise. The price sits between double rules. Warmer and louder than Deco, still unmistakably from the logo.',
    tag: (p) => `<div class="tag"><svg class="outline" aria-hidden="true"></svg><span class="eyelet"></span><div class="frame">
      <span class="stamp" role="img" aria-label="Clipboard"></span>

      ${actions(p)}</div></div>`,
  },
  {
    key: 'ziggurat', family: 'deco-family', title: 'Deco: Ziggurat', note: 'stepped window, capitals',
    blurb: 'Black, with the photo window stepping up to the centre like a Deco skyline and edged in crimson. Stepped ornaments echo it above the name and either side of the price, and the name is set in spaced capitals like the logo. The most architectural of the three.',
    tag: (p) => `<div class="tag"><svg class="outline" aria-hidden="true"></svg><span class="eyelet"></span><div class="frame">
      <span class="stamp" role="img" aria-label="Clipboard"></span>
      <div class="steps">${photo(p)}</div>

const jump = document.getElementById('jump')
const root = document.getElementById('designs')
for (const d of DESIGNS) {
  jump.insertAdjacentHTML('beforeend', `<a href="#${d.key}">${d.title}</a>`)
  root.insertAdjacentHTML('beforeend', `<section class="design t-${d.key} ${d.family ?? ''}" id="${d.key}" aria-labelledby="h-${d.key}">
    <div class="design-head"><h2 id="h-${d.key}">${d.title}<small>${d.note}</small></h2><p>${d.blurb}</p></div>
    <div class="rack">${PRODUCTS.map((p) => `<article class="hang"><div class="swing">${LOOP}${d.tag(p)}</div></article>`).join('')}</div>
  </section>`)
}

// Insets the tag's outline (cut corners, rounded bottom) by d px and returns an SVG path.
function insetPath(w, h, d, cut = 44, radius = 16) {
  const pts = [[0, cut], [w * 0.22, 0], [w * 0.78, 0], [w, cut], [w, h], [0, h]]
  const n = pts.length
  // Each edge shifted inward along its normal (the polygon runs clockwise on screen).
  const lines = pts.map((a, i) => {
    const b = pts[(i + 1) % n]
    const len = Math.hypot(b[0] - a[0], b[1] - a[1])
    const nx = -(b[1] - a[1]) / len, ny = (b[0] - a[0]) / len
    return [[a[0] + nx * d, a[1] + ny * d], [b[0] + nx * d, b[1] + ny * d]]
  })
  const meet = ([p1, p2], [p3, p4]) => {
    const den = (p1[0] - p2[0]) * (p3[1] - p4[1]) - (p1[1] - p2[1]) * (p3[0] - p4[0])
    const t = ((p1[0] - p3[0]) * (p3[1] - p4[1]) - (p1[1] - p3[1]) * (p3[0] - p4[0])) / den
    return [p1[0] + t * (p2[0] - p1[0]), p1[1] + t * (p2[1] - p1[1])]
  }
  const c = lines.map((l, i) => meet(lines[(i + n - 1) % n], l))
  const r = Math.max(radius - d, 2)
  const [br, bl] = [c[4], c[5]]
  return `M${c[0]} L${c[1]} L${c[2]} L${c[3]} L${br[0]},${br[1] - r} Q${br} ${br[0] - r},${br[1]} L${bl[0] + r},${bl[1]} Q${bl} ${bl[0]},${bl[1] - r} Z`
}
function drawFrames() {
  document.querySelectorAll('.tag > .outline').forEach((outline) => {
    const tag = outline.parentElement
    const { offsetWidth: w, offsetHeight: h } = tag
    outline.innerHTML = `<path d="${insetPath(w, h, 6.5)}"/><path d="${insetPath(w, h, 10.5)}"/>`
  })
}
new ResizeObserver(drawFrames).observe(document.body)
document.fonts.ready.then(drawFrames)

document.addEventListener('click', (e) => {
  const heart = e.target.closest('.heart')
  if (heart) heart.setAttribute('aria-pressed', heart.getAttribute('aria-pressed') !== 'true')
  if (e.target.closest('.photo, .view')) e.preventDefault()
})

// The swing from src/hooks/useSwing.js, unchanged: a damped spring the pointer knocks.
const STIFFNESS = 60
const DAMPING = 5.5
const MAX_ANGLE = 6
const MAX_SPEED = 60
const NUDGE = 28
const DRAG = 0.3
const clamp = (value, max) => Math.max(-max, Math.min(max, value))

function hang(area) {
  const el = area.querySelector('.swing')
  let angle = 0, speed = 0, frame = 0, last = 0
  function step(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30)
    last = now
    speed += (-STIFFNESS * angle - DAMPING * speed) * dt
    angle = clamp(angle + speed * dt, MAX_ANGLE)
    if (Math.abs(angle) < 0.02 && Math.abs(speed) < 0.05) {
      angle = 0; speed = 0; frame = 0; el.style.transform = ''
      return
    }
    el.style.transform = `rotate(${angle}deg)`
    frame = requestAnimationFrame(step)
  }
  function push(amount) {
    speed = clamp(speed + amount, MAX_SPEED)
    if (!frame) { last = performance.now(); frame = requestAnimationFrame(step) }
  }
  area.addEventListener('pointerenter', (e) => {
    if (e.pointerType !== 'mouse') return
    const box = area.getBoundingClientRect()
    push(e.clientX < box.left + box.width / 2 ? -NUDGE : NUDGE)
  })
  area.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') push(-e.movementX * DRAG) })
  area.addEventListener('focusin', (e) => { if (e.target.matches(':focus-visible')) push(NUDGE * 0.6) })
}
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelectorAll('.hang').forEach(hang)
</script>
