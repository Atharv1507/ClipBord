<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipbord</title>
<script>/* Mode before first paint: saved choice, ?mode=light|dark, else the system setting. */(function(){var t,q=new URLSearchParams(location.search).get('mode');try{t=JSON.parse(localStorage.getItem('cb3-mode'))}catch(e){}document.documentElement.dataset.theme=q==='dark'?'oxblood':q==='light'?'paper':t||(matchMedia('(prefers-color-scheme: dark)').matches?'oxblood':'paper')})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="category">
<div id="chrome-header"></div>

<main id="main">
  <header class="page-head">
    <p class="crumb" id="catCrumb"></p>
    <h1 class="page-title display" id="catTitle"></h1>
    <div class="page-bar">
      <nav class="pills" id="catPills" aria-label="Categories"></nav>
      <label class="sort">Sort
        <select id="sort">
          <option value="new">Newest</option>
          <option value="low">Price, low to high</option>
          <option value="high">Price, high to low</option>
        </select>
      </label>
    </div>
  </header>
  <div class="grid" id="catGrid"></div>

  <section class="section" aria-labelledby="moreTitle">
    <div class="section-head"><h2 id="moreTitle">More to shop</h2></div>
    <div class="tiles" id="moreTiles"></div>
  </section>
</main>

<div id="chrome-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="app.js"></script>
</body>
</html>
