<script>/* Mode before first paint: saved choice, ?mode=light|dark, else the system setting. */(function(){var t,q=new URLSearchParams(location.search).get('mode');try{t=JSON.parse(localStorage.getItem('cb3-mode'))}catch(e){}document.documentElement.dataset.theme=q==='dark'?'noir':q==='light'?'paper':(t==='paper'||t==='noir'?t:t?'noir':'')||(matchMedia('(prefers-color-scheme: dark)').matches?'noir':'paper')})()</script>
