<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clipboard card designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300..800&family=Forum&display=swap" />
<style>
  /* Same tokens as src/index.css. */
  :root {
    --ink: #000;
    --smoke: #111;
    --raised: #1a1a1a;
    --paper: #f3efe6;
    --paper-dim: #e6e0d3;
    --mute: #9a958c;
    --ink-mute: #6e685e;
    --crimson: #b3122e;
    --crimson-bright: #e0475c;
    --display: "Forum", Georgia, serif;
    --sans: "Jost", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--ink); color: var(--paper); color-scheme: dark; -webkit-font-smoothing: antialiased; }
  body { margin: 0; font-family: var(--sans); background: var(--ink); }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--crimson-bright); outline-offset: 3px; }

  .page { max-width: 1320px; margin: 0 auto; padding: 56px 24px 120px; }
  .page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 40px; }
  .page-head h1 { font: 400 clamp(44px, 6vw, 72px)/1 var(--display); margin: 0; letter-spacing: -0.01em; }
  .page-head p { max-width: 52ch; margin: 0; color: var(--mute); line-height: 1.6; }

  .jump { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 32px; }
  .jump a { padding: 8px 16px; border-radius: 999px; background: var(--raised); color: var(--mute); font-size: 14px; transition: color .2s, background .2s; }
  .jump a:hover { color: var(--paper); background: #262626; }

  .design { padding-top: 96px; scroll-margin-top: 16px; }
  .design-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 8px 40px; align-items: baseline; border-top: 1px solid rgb(243 239 230 / .12); padding-top: 24px; }
  .design-head h2 { font: 400 44px/1 var(--display); margin: 0; }
  .design-head h2 small { font: 400 15px var(--sans); color: var(--mute); margin-left: 12px; letter-spacing: 0; }
  .design-head p { margin: 0; color: var(--mute); line-height: 1.6; max-width: 60ch; }
  @media (max-width: 760px) { .design-head { grid-template-columns: 1fr; } }

  /* The rail the tags hang from, as on the site. */
  .rack { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 28px; margin-top: 40px; }
  .rack::before { content: ""; position: absolute; left: -12px; right: -12px; top: 0; height: 4px; border-radius: 2px; background: #2a2a2a; }
  @media (max-width: 1040px) { .rack { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px 28px; } }
  @media (max-width: 560px) { .rack { grid-template-columns: minmax(0, 1fr); } }

  /* ---------- Shared skeleton: loop, foil-edged die-cut tag, eyelet, swing ---------- */
  .hang { position: relative; max-width: 300px; width: 100%; margin: 0 auto; user-select: none; }
  .swing { position: relative; transform-origin: top center; padding-top: 40px; will-change: transform; }
  .loop { position: absolute; left: 50%; top: 0; z-index: 4; width: 20px; height: 62px; transform: translateX(-50%); overflow: visible; }
  .loop path { fill: none; stroke: var(--crimson); stroke-width: 1.75; stroke-linecap: round; }

  /* The crimson layer is the foil; the face sits 1.5px inside it. The notches either side
     of the perforation are cut by a mask at --seam, which the script sets from the stub. */
  .tag {
    --cut: 44px;
    position: relative; padding: 1.5px; border-radius: 0 0 16px 16px; background: var(--crimson);
    clip-path: polygon(22% 0, 78% 0, 100% var(--cut), 100% 100%, 0 100%, 0 var(--cut));
    -webkit-mask: radial-gradient(circle 7px at 0 var(--seam, -20px), #0000 98%, #000), radial-gradient(circle 7px at 100% var(--seam, -20px), #0000 98%, #000);
    -webkit-mask-composite: source-in;
    mask: radial-gradient(circle 7px at 0 var(--seam, -20px), #0000 98%, #000), radial-gradient(circle 7px at 100% var(--seam, -20px), #0000 98%, #000);
    mask-composite: intersect;
  }
  .face {
    position: relative; overflow: hidden; border-radius: 0 0 15px 15px; background: var(--smoke);
    clip-path: polygon(calc(22% + .6px) 0, calc(78% - .6px) 0, 100% calc(var(--cut) + .4px), 100% 100%, 0 100%, 0 calc(var(--cut) + .4px));
  }
  .eyelet { position: absolute; left: 50%; top: 14px; z-index: 3; width: 14px; height: 14px; transform: translateX(-50%); border-radius: 50%; background: var(--ink);
    box-shadow: 0 0 0 3px var(--crimson), 0 0 0 5px var(--paper-dim), 0 0 0 6px rgb(179 18 46 / .45); }

  /* The photo fills the face edge to edge, right up under the cut corners, so there is
     never a band of tag colour above or beside it. object-fit: cover takes any shot. */
  .photo { position: relative; display: block; aspect-ratio: 4 / 5; overflow: hidden; background: var(--raised); }
  .frame { position: relative; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; transition: transform .7s ease-out; }
  .hang:hover .photo img { transform: scale(1.04); }

  .name { margin: 0; font: 400 22px/1.12 var(--display); text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .eyebrow { display: block; font: 500 10.5px/1 var(--sans); text-transform: uppercase; letter-spacing: .16em; }

  /* The black stub: CB monogram, price, bookmark (as in ProductCard). */
  .stub { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 14px; color: var(--paper); background: var(--smoke); }
  .perf::before { content: ""; position: absolute; left: 12px; right: 12px; top: -1px; height: 2px; z-index: 2;
    background: radial-gradient(circle, var(--ink) 0 1.1px, transparent 1.5px) 0 50% / 7px 2px repeat-x; }
  .mono { display: block; flex-shrink: 0; height: 32px; aspect-ratio: 161 / 293; background: currentColor;
    -webkit-mask: url(monogram.svg) center / contain no-repeat; mask: url(monogram.svg) center / contain no-repeat; }
  .vr { flex-shrink: 0; align-self: stretch; width: 1px; margin: 2px 0; background: rgb(243 239 230 / .15); }
  .price { margin: 0; font: 400 20px/1.1 var(--display); color: var(--crimson-bright); font-variant-numeric: tabular-nums; }
  .tax { margin: 2px 0 0; font-size: 11.5px; color: var(--mute); }
  .save { margin-left: auto; flex-shrink: 0; display: grid; place-items: center; width: 42px; height: 42px; border: 0; border-radius: 10px; background: transparent;
    color: var(--paper); box-shadow: inset 0 0 0 1.5px rgb(243 239 230 / .2); transition: background .2s; }
  .save:hover { background: rgb(243 239 230 / .05); }
  .save svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; transition: transform .2s; }
  .save[aria-pressed="true"] svg { transform: scale(1.1); fill: var(--crimson-bright); stroke: var(--crimson-bright); }

  /* ---------- 1. Caption: the name printed over the bottom of the photo ---------- */
  .d-caption .photo::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgb(0 0 0 / .82) 0%, rgb(0 0 0 / .45) 26%, rgb(0 0 0 / 0) 50%); }
  .d-caption .caption { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 1; color: var(--paper); }
  .d-caption .eyebrow { color: rgb(243 239 230 / .7); margin-bottom: 8px; }
  .d-caption .name { font-size: 24px; text-shadow: 0 1px 12px rgb(0 0 0 / .35); }

  /* ---------- 2. Ticket: the name moves down into the black stub ---------- */
  .d-ticket .stub { display: block; padding: 0; }
  .d-ticket .title { padding: 16px 16px 14px; }
  .d-ticket .eyebrow { color: var(--mute); margin-bottom: 8px; }
  .d-ticket .meta { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid rgb(243 239 230 / .1); }

  /* ---------- 3. Polaroid: cream mat, caption written in the deep bottom margin ---------- */
  .d-polaroid .face { background: var(--paper-dim); }
  .d-polaroid .photo { margin: 10px 10px 0; aspect-ratio: 1 / 1.1; border-radius: 3px;
    clip-path: polygon(calc(22% - 3px) 0, calc(78% + 3px) 0, 100% 30px, 100% 100%, 0 100%, 0 30px); }
  .d-polaroid .caption { display: flex; flex-direction: column; justify-content: center; height: 76px; padding: 4px 16px 6px; text-align: center; color: var(--ink); }
  .d-polaroid .eyebrow { color: var(--ink-mute); font-size: 9.5px; margin-bottom: 6px; }
  .d-polaroid .name { font-size: 20px; }

  /* ---------- 4. Woven label: a stitched crimson label sewn onto the photo ---------- */
  .d-label .photo::after { content: ""; position: absolute; inset: 55% 0 0; pointer-events: none; background: linear-gradient(to top, rgb(0 0 0 / .35), rgb(0 0 0 / 0)); }
  .d-label .woven { position: absolute; left: 14px; bottom: 14px; z-index: 1; max-width: calc(100% - 28px); padding: 10px 14px 11px; border-radius: 2px;
    background: var(--crimson); color: var(--paper); box-shadow: 0 6px 16px rgb(0 0 0 / .35);
    outline: 1px dashed rgb(243 239 230 / .55); outline-offset: -5px; }
  .d-label .eyebrow { font-size: 9.5px; color: rgb(243 239 230 / .75); margin-bottom: 6px; }
  .d-label .name { font-size: 19px; }

  /* ---------- 5. Spine: the name runs up a black spine beside the photo ---------- */
  .d-spine .body { display: grid; grid-template-columns: minmax(0, 1fr) 46px; }
  .d-spine .photo { aspect-ratio: 3.4 / 5; }
  .d-spine .spine { position: relative; contain: size; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 14px; padding: 52px 0 16px;
    background: var(--smoke); border-left: 1px solid rgb(243 239 230 / .08); }
  .d-spine .spine .name { writing-mode: vertical-rl; transform: rotate(180deg); display: block; min-height: 0; flex: 0 1 auto; overflow: hidden;
    font-size: 16px; line-height: 1.1; letter-spacing: .05em; text-wrap: balance; text-transform: uppercase; color: var(--paper); }
  .d-spine .spine .eyebrow { writing-mode: vertical-rl; transform: rotate(180deg); flex-shrink: 0; color: var(--crimson-bright); font-size: 10px; }

  @media (prefers-reduced-motion: reduce) { .photo img { transition: none; } .hang:hover .photo img { transform: none; } }
</style>
</head>
<body>
<main class="page">
  <header class="page-head">
    <h1>Card designs</h1>
    <p>Five takes on the product tag for real product photos. In each one the photo fills the tag edge to edge, up under the cut corners, so no band of cream shows around it, and the name gets a designed home instead of a loose cream strip.</p>
  </header>
  <nav class="jump" id="jump"></nav>
  <div id="designs"></div>
</main>

<script>
// The new products in the catalogue.
const PRODUCTS = [
  { _id: '6ac12f8e82f4c5a34c206453', name: 'ADHD Pool Ball Hoodie', price: 2499, category: 'Sweat Shirt',
    image: 'https://res.cloudinary.com/dmxf5exhr/image/upload/v1791045517/clipBoard/product-images/kz9ekm5nrf5lau34y4yr.jpg' },
  { _id: '6ac12f8f82f4c5a34c206454', name: 'Queue the Cause Hoodie', price: 2599, category: 'Sweat Shirt',
    image: 'https://res.cloudinary.com/dmxf5exhr/image/upload/v1791045518/clipBoard/product-images/hmuakitbn63bhv949tqi.jpg' },
  { _id: '6ac12f8b82f4c5a34c206451', name: 'ADHD Pool Ball Tee', price: 999, category: 'Tshirt',
    image: 'https://res.cloudinary.com/dmxf5exhr/image/upload/v1791045515/clipBoard/product-images/wogrqv5ymxq67izpxoy9.jpg' },
  { _id: '6ac12f8c82f4c5a34c206452', name: 'Cue the Chaos Tee', price: 1099, category: 'Tshirt',
    image: 'https://res.cloudinary.com/dmxf5exhr/image/upload/v1791045516/clipBoard/product-images/uvlkk8bxe9o595jkv8lo.jpg' },
]
const LABELS = { Tshirt: 'T-shirt', 'Sweat Shirt': 'Sweatshirt', Joggers: 'Joggers' }
const rupees = (n) => `₹${Number(n).toLocaleString('en-IN')}`
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

const LOOP = `<svg class="loop" viewBox="0 0 20 62" aria-hidden="true"><path d="M8 62 L7.2 7 Q10 -2.2 12.8 7 L12 62"/></svg>`
const BOOKMARK = `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10a1.5 1.5 0 0 1 1.5 1.5v15.5L12 16l-6.5 4.5V5A1.5 1.5 0 0 1 7 3.5z"/></svg>`
const img = (p) => `<img src="${p.image}" alt="" loading="lazy" draggable="false">`
const photo = (p, inner = '') => `<a href="#" class="photo" tabindex="-1" aria-hidden="true">${img(p)}${inner}</a>`
const title = (p) => `<h3 class="name"><a href="#">${esc(p.name)}</a></h3>`
const priceBlock = (p) => `<div><p class="price">${rupees(p.price)}</p><p class="tax">Incl. of all taxes</p></div>`
const save = (p) => `<button type="button" class="save" aria-pressed="false" aria-label="Save ${esc(p.name)} to wishlist">${BOOKMARK}</button>`
const stubRow = (p) => `<span class="mono" role="img" aria-label="Clipboard"></span><span class="vr" aria-hidden="true"></span>${priceBlock(p)}${save(p)}`

const DESIGNS = [
  {
    key: 'caption', title: 'Caption', note: 'name printed over the photo',
    blurb: 'The photo runs from the top of the tag down to the perforation, and the name is set over its bottom edge on a soft dark fade, with the category above it. No cream strip at all, so the photo gets the most room and every card has the same shape whatever the name length.',
    tag: (p) => `<div class="face"><span class="eyelet"></span>
      <div class="frame">${photo(p)}
        <div class="caption"><span class="eyebrow">${LABELS[p.category]}</span>${title(p)}</div></div>
      <div class="stub perf">${stubRow(p)}</div></div>`,
  },
  {
    key: 'ticket', title: 'Ticket', note: 'name moves into the stub',
    blurb: 'The photo stays clean, with nothing over it. Below the perforation the black stub grows to hold the name and category on top, then the monogram, price and bookmark under a hairline. Cream text on black reads well, and the photo and the words never fight.',
    tag: (p) => `<div class="face"><span class="eyelet"></span>
      ${photo(p)}
      <div class="stub perf"><div class="title"><span class="eyebrow">${LABELS[p.category]}</span>${title(p)}</div>
        <div class="meta">${stubRow(p)}</div></div></div>`,
  },
  {
    key: 'polaroid', title: 'Polaroid', note: 'cream mat, caption in the margin',
    blurb: 'Keeps the cream tag, but the photo sits in an even 10px mat that follows the cut corners, like a print. The deeper bottom margin holds the name and category on one line, so the cream reads as a deliberate frame rather than leftover space. Works for dark and light garments alike.',
    tag: (p) => `<div class="face"><span class="eyelet"></span>
      ${photo(p)}
      <div class="caption"><span class="eyebrow">${LABELS[p.category]}</span>${title(p)}</div>
      <div class="stub perf">${stubRow(p)}</div></div>`,
  },
  {
    key: 'label', title: 'Woven label', note: 'stitched crimson label on the photo',
    blurb: 'A small crimson label, with a stitched edge like a woven garment label, is sewn onto the bottom corner of the photo and carries the name. It sizes to the name, so short names get a short label, and it brings the brand red onto the photo.',
    tag: (p) => `<div class="face"><span class="eyelet"></span>
      <div class="frame">${photo(p)}
        <div class="woven"><span class="eyebrow">${LABELS[p.category]}</span>${title(p)}</div></div>
      <div class="stub perf">${stubRow(p)}</div></div>`,
  },
  {
    key: 'spine', title: 'Spine', note: 'name runs up the side',
    blurb: 'Like the spine of a book or the side of a shoebox: the name runs up a slim black strip beside the photo in spaced capitals, with the category in red at the top. The photo keeps its full height, and the name has the tag’s whole height to fit in, so long names fit too.',
    tag: (p) => `<div class="face"><span class="eyelet"></span>
      <div class="body">${photo(p)}<div class="spine">${title(p)}<span class="eyebrow">${LABELS[p.category]}</span></div></div>
      <div class="stub perf">${stubRow(p)}</div></div>`,
  },
]

document.getElementById('jump').innerHTML = DESIGNS.map((d, i) => `<a href="#${d.key}">${i + 1}. ${d.title}</a>`).join('')
document.getElementById('designs').innerHTML = DESIGNS.map((d, i) => `
  <section class="design d-${d.key}" id="${d.key}">
    <div class="design-head"><h2>${i + 1}. ${d.title}<small>${d.note}</small></h2><p>${d.blurb}</p></div>
    <div class="rack">${PRODUCTS.map((p) => `<article class="hang"><div class="swing">${LOOP}<div class="tag">${d.tag(p)}</div></div></article>`).join('')}</div>
  </section>`).join('')

// The notches sit on the perforation, wherever the stub starts in each design.
function placeNotches() {
  document.querySelectorAll('.tag').forEach((tag) => {
    const stub = tag.querySelector('.perf')
    if (stub) tag.style.setProperty('--seam', `${stub.offsetTop + 1.5}px`)
  })
}
new ResizeObserver(placeNotches).observe(document.body)
document.fonts.ready.then(placeNotches)

document.addEventListener('click', (e) => {
  const button = e.target.closest('.save')
  if (button) button.setAttribute('aria-pressed', button.getAttribute('aria-pressed') !== 'true')
  if (e.target.closest('a[href="#"]')) e.preventDefault()
})

// The swing from src/hooks/useSwing.js, unchanged: a damped spring the pointer knocks.
const STIFFNESS = 60
const DAMPING = 5.5
const MAX_ANGLE = 6
const MAX_SPEED = 60
const NUDGE = 28
const DRAG = 0.3
const clamp = (value, max) => Math.max(-max, Math.min(max, value))

function hang(area) {
  const el = area.querySelector('.swing')
  let angle = 0, speed = 0, frame = 0, last = 0
  function step(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30)
    last = now
    speed += (-STIFFNESS * angle - DAMPING * speed) * dt
    angle = clamp(angle + speed * dt, MAX_ANGLE)
    if (Math.abs(angle) < 0.02 && Math.abs(speed) < 0.05) {
      angle = 0; speed = 0; frame = 0; el.style.transform = ''
      return
    }
    el.style.transform = `rotate(${angle}deg)`
    frame = requestAnimationFrame(step)
  }
  function push(amount) {
    speed = clamp(speed + amount, MAX_SPEED)
    if (!frame) { last = performance.now(); frame = requestAnimationFrame(step) }
  }
  area.addEventListener('pointerenter', (e) => {
    if (e.pointerType !== 'mouse') return
    const box = area.getBoundingClientRect()
    push(e.clientX < box.left + box.width / 2 ? -NUDGE : NUDGE)
  })
  area.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') push(-e.movementX * DRAG) })
  area.addEventListener('focusin', (e) => { if (e.target.matches(':focus-visible')) push(NUDGE * 0.6) })
}
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelectorAll('.hang').forEach(hang)
</script>
</body>
</html>
