<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clipbord palettes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300..700&family=Forum&display=swap" />
<style>
  /* Page chrome stays neutral so each palette is judged on its own. Type is the site's:
     Forum for display and names, Jost for small UI text. Only colour changes per palette. */
  :root {
    --chrome-bg: #0d0d0e;
    --chrome-text: #ecebe8;
    --chrome-mute: #96948f;
    --chrome-line: rgb(236 235 232 / .12);
    --display: "Forum", Georgia, serif;
    --sans: "Jost", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--chrome-bg); color: var(--chrome-text); font-family: var(--sans); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

  .page { max-width: 1320px; margin: 0 auto; padding: 56px 24px 120px; }
  .intro h1 { margin: 0; font: 400 clamp(44px, 6vw, 72px)/1 var(--display); }
  .intro p { margin: 16px 0 0; max-width: 62ch; color: var(--chrome-mute); line-height: 1.6; }
  .jump { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
  .jump a { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px; border-radius: 999px; background: #1a1a1b; color: var(--chrome-mute); font-size: 14px; transition: color .2s, background .2s; }
  .jump a:hover { color: var(--chrome-text); background: #262628; }
  .jump i { width: 18px; height: 18px; border-radius: 50%; background: var(--dot); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .15); }

  /* Today's palette, for comparison. */
  .today { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--chrome-line); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px 40px; align-items: center; }
  .today h2 { margin: 0; font: 400 28px/1.1 var(--display); }
  .today p { margin: 6px 0 0; color: var(--chrome-mute); line-height: 1.5; }
  .today-chips { margin-top: 0; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (max-width: 860px) { .today { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { .today-chips { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .palette { padding-top: 96px; scroll-margin-top: 16px; }
  .p-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px 40px; border-top: 1px solid var(--chrome-line); padding-top: 24px; }
  .p-head h2 { margin: 0; font: 400 44px/1 var(--display); }
  .p-head .why { margin: 0; color: var(--chrome-mute); line-height: 1.6; max-width: 62ch; }
  @media (max-width: 860px) { .p-head { grid-template-columns: 1fr; } }

  /* Swatches: the role, the hex, and for text colours their contrast on the page. */
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; margin-top: 28px; }
  .chip { display: grid; grid-template-rows: 64px auto; border-radius: 12px; overflow: hidden; background: #161617; box-shadow: inset 0 0 0 1px var(--chrome-line); }
  .chip b { display: block; background: var(--c); box-shadow: inset 0 -1px 0 var(--chrome-line); }
  .chip span { padding: 10px 12px 12px; font-size: 13px; line-height: 1.35; }
  .chip strong { display: block; font-weight: 500; }
  .chip code { font: 12px ui-monospace, Menlo, monospace; color: var(--chrome-mute); }
  .chip em { display: block; font-style: normal; font-size: 12px; color: var(--chrome-mute); }

  /* ---------- The mini storefront, driven entirely by the palette's tokens ---------- */
  .site { margin-top: 20px; border-radius: 16px; overflow: hidden; background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--chrome-line); }
  .nav { display: flex; align-items: center; gap: 28px; height: 68px; padding: 0 32px; border-bottom: 1px solid var(--line); }
  .logo { display: block; height: 30px; aspect-ratio: 1000 / 643; background: var(--text);
    -webkit-mask: url(logo.svg) center / contain no-repeat; mask: url(logo.svg) center / contain no-repeat; }
  .nav nav { display: flex; gap: 24px; margin-left: auto; font-size: 15px; }
  .nav nav a { color: var(--muted); transition: color .2s; }
  .nav nav a:hover, .nav nav a[aria-current] { color: var(--text); }
  .bag { position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
  .bag svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .bag sup { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font: 600 11px/18px var(--sans); text-align: center; }

  .hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); min-height: 460px; background: var(--hero, var(--bg)); }
  .hero-copy { align-self: center; padding: 56px 32px 56px 48px; }
  .hero h3 { margin: 0; font: 400 clamp(48px, 5.6vw, 78px)/.98 var(--display); letter-spacing: -0.015em; text-wrap: balance; color: var(--hero-text, var(--text)); }
  .hero p { margin: 20px 0 0; max-width: 34ch; font-size: 17px; line-height: 1.55; color: var(--hero-muted, var(--muted)); }
  .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
  .btn { display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 999px; font-weight: 500; font-size: 15px; transition: transform .15s, filter .2s, background .2s; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { color: var(--hero-text, var(--text)); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
  .btn.ghost:hover { background: var(--line); }
  .hero-photo { position: relative; overflow: hidden; background: var(--raised); }
  .hero-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 28%; }
  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; }
    .hero-copy { padding: 40px 24px; }
    .hero-photo { aspect-ratio: 4 / 4.2; }
    .nav { padding: 0 20px; gap: 16px; }
    .nav nav { display: none; }
    .bag { margin-left: auto; }
  }

  .shop { padding: 40px 32px 56px; }
  .shop-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; }
  .shop-head h4 { margin: 0; font: 400 32px/1 var(--display); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filters span { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; font-size: 14px; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .filters span[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: none; }
  .filters i { width: 10px; height: 10px; border-radius: 50%; background: var(--dotc); }
  @media (max-width: 560px) { .shop { padding: 32px 16px 44px; } }

  /* ---------- Ticket tag (the live ProductCard), recoloured by tokens ---------- */
  .rack { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 24px; margin-top: 28px; }
  .rack::before { content: ""; position: absolute; left: -12px; right: -12px; top: 0; height: 4px; border-radius: 2px; background: var(--line-strong); }
  @media (max-width: 1040px) { .rack { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 44px 20px; } }
  .hang { position: relative; max-width: 280px; width: 100%; margin: 0 auto; user-select: none; }
  .swing { position: relative; transform-origin: top center; padding-top: 40px; will-change: transform; }
  .loop { position: absolute; left: 50%; top: 0; z-index: 4; width: 20px; height: 62px; transform: translateX(-50%); overflow: visible; }
  .loop path { fill: none; stroke: var(--foil); stroke-width: 1.75; stroke-linecap: round; }
  .tag {
    --cut: 44px;
    position: relative; padding: 1.5px; border-radius: 0 0 16px 16px; background: var(--foil);
    clip-path: polygon(22% 0, 78% 0, 100% var(--cut), 100% 100%, 0 100%, 0 var(--cut));
    -webkit-mask: radial-gradient(circle 7px at 0 var(--seam, -20px), #0000 98%, #000), radial-gradient(circle 7px at 100% var(--seam, -20px), #0000 98%, #000);
    -webkit-mask-composite: source-in;
    mask: radial-gradient(circle 7px at 0 var(--seam, -20px), #0000 98%, #000), radial-gradient(circle 7px at 100% var(--seam, -20px), #0000 98%, #000);
    mask-composite: intersect;
  }
  .face { position: relative; overflow: hidden; border-radius: 0 0 15px 15px; background: var(--surface);
    clip-path: polygon(calc(22% + .6px) 0, calc(78% - .6px) 0, 100% calc(var(--cut) + .4px), 100% 100%, 0 100%, 0 calc(var(--cut) + .4px)); }
  .eyelet { position: absolute; left: 50%; top: 14px; z-index: 3; width: 14px; height: 14px; transform: translateX(-50%); border-radius: 50%; background: var(--bg);
    box-shadow: 0 0 0 3px var(--foil), 0 0 0 5px var(--ring); }
  .photo { display: block; aspect-ratio: 1 / 1.025; overflow: hidden; background: var(--raised); }
  .photo img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; transition: transform .7s ease-out; }
  .hang:hover .photo img { transform: scale(1.04); }
  .title { position: relative; padding: 14px 16px 12px; }
  .title::before { content: ""; position: absolute; left: 12px; right: 12px; top: -1px; height: 2px;
    background: radial-gradient(circle, var(--bg) 0 1.1px, transparent 1.5px) 0 50% / 7px 2px repeat-x; }
  .cat { display: block; font-size: 10.5px; line-height: 1; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); }
  .name { margin: 8px 0 0; font: 400 21px/1.12 var(--display); color: var(--text); text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); }
  .mono { flex-shrink: 0; height: 30px; aspect-ratio: 161 / 293; background: var(--text);
    -webkit-mask: url(monogram.svg) center / contain no-repeat; mask: url(monogram.svg) center / contain no-repeat; }
  .vr { flex-shrink: 0; align-self: stretch; width: 1px; margin: 2px 0; background: var(--line-strong); }
  .price { margin: 0; font: 400 20px/1.1 var(--display); color: var(--price); font-variant-numeric: tabular-nums; }
  .tax { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
  .save { margin-left: auto; flex-shrink: 0; display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line-strong); transition: background .2s; }
  .save:hover { background: var(--line); }
  .save svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; transition: transform .2s; }
  .save[aria-pressed="true"] svg { transform: scale(1.1); fill: var(--price); stroke: var(--price); }

  .foot { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 32px; padding: 32px 32px 28px; background: var(--foot, var(--surface)); border-top: 1px solid var(--line); }
  .foot p { margin: 0; font-size: 14px; color: var(--muted); }
  .foot a { display: inline-block; margin-top: 6px; font: 400 clamp(26px, 3.4vw, 40px)/1.1 var(--display); color: var(--text); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 6px; }
  .foot small { font-size: 13px; color: var(--muted); }
  @media (max-width: 560px) { .foot { padding: 28px 16px; } }

  /* ---------- The palettes ---------- */
  .p-felt {
    --bg: #0A1511; --surface: #10231C; --raised: #173328; --hero: #1D4A39;
    --text: #ECEFE7; --muted: #93A79C; --hero-muted: #B7C8BD;
    --line: rgb(236 239 231 / .1); --line-strong: rgb(236 239 231 / .22);
    --accent: #5B8DEF; --on-accent: #07101F; --price: #7FA6F2; --foil: #5B8DEF; --ring: #2B4D40;
  }
  .p-maple {
    --bg: #0F0E0D; --surface: #191715; --raised: #23201D;
    --text: #F0ECE6; --muted: #A39C92;
    --line: rgb(240 236 230 / .09); --line-strong: rgb(240 236 230 / .2);
    --accent: #D2A26E; --on-accent: #1A120A; --price: #D9AE7E; --foil: #D2A26E; --ring: #3A3029;
  }
  .p-chalk {
    color-scheme: light;
    --bg: #E9EAEC; --surface: #F7F7F8; --raised: #DCDDE0;
    --text: #121316; --muted: #585B62;
    --line: rgb(18 19 22 / .09); --line-strong: rgb(18 19 22 / .2);
    --accent: #E4570F; --on-accent: #121316; --price: #B83D06; --foil: #121316; --ring: #C9CBCF;
    --foot: #121316;
  }
  .p-chalk .foot { --text: #F7F7F8; --muted: #A4A7AE; --line: rgb(247 247 248 / .1); }
  .p-cobalt {
    --bg: #1D3FCB; --surface: #152F9E; --raised: #12287F;
    --text: #F3F4F8; --muted: #C3CCF1;
    --line: rgb(243 244 248 / .14); --line-strong: rgb(243 244 248 / .32);
    --accent: #F3F4F8; --on-accent: #1D3FCB; --price: #FFFFFF; --foil: #F3F4F8; --ring: #3756D6;
  }
  .p-rack {
    --bg: #121417; --surface: #1A1D21; --raised: #23272D;
    --text: #EEF0F2; --muted: #9AA0A8;
    --line: rgb(238 240 242 / .09); --line-strong: rgb(238 240 242 / .2);
    --accent: #D7263D; --on-accent: #FFFFFF; --price: #F2677A; --foil: #D7263D; --ring: #2C3036;
    --ball-green: #2E9E5B; --ball-blue: #2F6FDE; --ball-orange: #F08A24;
  }
  /* Full rack: each category hangs on its own ball colour. */
  .p-rack [data-cat="Tshirt"] { --foil: var(--ball-green); }
  .p-rack [data-cat="Sweat Shirt"] { --foil: var(--ball-blue); }
  .p-rack [data-cat="Joggers"] { --foil: var(--ball-orange); }

  @media (prefers-reduced-motion: reduce) { .photo img { transition: none; } .hang:hover .photo img { transform: none; } }
</style>
</head>
<body>
<main class="page">
  <header class="intro">
    <h1>Five palettes</h1>
    <p>Each one is drawn from the products themselves: the felt of the table, the maple of the cue, the chalk, and the ball colours on the ADHD print. Below each is the same storefront, so you can compare them on the real photos.</p>
    <nav class="jump" id="jump"></nav>
  </header>

  <section class="today" aria-label="Today's palette">
    <div><h2>Today</h2><p>Black, cream and crimson. For comparison.</p></div>
    <div class="swatches today-chips" id="today"></div>
  </section>

  <div id="palettes"></div>
</main>

<script>
const IMG = 'https://res.cloudinary.com/dmxf5exhr/image/upload/'
const P = {
  hoodieFront: { _id: 'a1', name: 'ADHD Pool Ball Hoodie', price: 2499, category: 'Sweat Shirt', image: IMG + 'v1791045517/clipBoard/product-images/kz9ekm5nrf5lau34y4yr.jpg' },
  hoodieBack: { _id: 'a2', name: 'Queue the Cause Hoodie', price: 2599, category: 'Sweat Shirt', image: IMG + 'v1791045518/clipBoard/product-images/hmuakitbn63bhv949tqi.jpg' },
  teeFront: { _id: 'a3', name: 'ADHD Pool Ball Tee', price: 999, category: 'Tshirt', image: IMG + 'v1791045515/clipBoard/product-images/wogrqv5ymxq67izpxoy9.jpg' },
  teeBack: { _id: 'a4', name: 'Cue the Chaos Tee', price: 1099, category: 'Tshirt', image: IMG + 'v1791045516/clipBoard/product-images/uvlkk8bxe9o595jkv8lo.jpg' },
  joggers: { _id: 'a5', name: 'Night Run Joggers', price: 1399, category: 'Joggers', image: IMG + 'v1790688386/clipBoard/product-images/uzjktcl7hptklik5u6v2.png' },
}
const LABELS = { Tshirt: 'T-shirt', 'Sweat Shirt': 'Sweatshirt', Joggers: 'Joggers' }
const rupees = (n) => `₹${Number(n).toLocaleString('en-IN')}`

// WCAG contrast, so the swatches report the real ratio.
function lum(hex) {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4))
  return 0.2126 * r + 0.7152 * g + 0.0722 * b
}
const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m); return ((x + 0.05) / (y + 0.05)).toFixed(1) }

const PALETTES = [
  {
    key: 'felt', name: 'Felt', dot: '#1D4A39',
    why: 'The table itself. Deep billiard-felt green for the page, with the blue of cue chalk for buttons and prices. Cream hoodies glow against it, and the whole site reads as a pool hall rather than a generic dark store.',
    hero: P.hoodieFront, headline: 'Rack them up.',
    swatches: [['Background', '#0A1511'], ['Felt', '#1D4A39', 'Hero and feature bands'], ['Surface', '#10231C'], ['Text', '#ECEFE7', null, '#0A1511'], ['Muted', '#93A79C', null, '#0A1511'], ['Chalk blue', '#5B8DEF', 'Buttons, tag edge'], ['Price', '#7FA6F2', null, '#10231C']],
    products: [P.hoodieFront, P.teeBack, P.hoodieBack, P.teeFront],
  },
  {
    key: 'maple', name: 'Maple', dot: '#D2A26E',
    why: 'Black and tan, taken from the cue: a near-black page with the maple of the shaft as the only accent. The closest to the site today, but warmer, and it leaves the red script on the garments as the only red on the page.',
    hero: P.teeBack, headline: 'Cue the chaos.',
    swatches: [['Background', '#0F0E0D'], ['Surface', '#191715'], ['Raised', '#23201D'], ['Text', '#F0ECE6', null, '#0F0E0D'], ['Muted', '#A39C92', null, '#0F0E0D'], ['Maple', '#D2A26E', 'Buttons, tag edge'], ['Price', '#D9AE7E', null, '#191715']],
    products: [P.teeBack, P.hoodieFront, P.teeFront, P.hoodieBack],
  },
  {
    key: 'chalk', name: 'Chalk', dot: '#E9EAEC',
    why: 'The only light option: cool chalk-dust grey, ink-black type and the orange of the 5-ball. The grey-backdrop hoodie shots sit right into the page, the black tees become strong dark tiles, and the black tag edge keeps the rail graphic.',
    hero: P.hoodieBack, headline: 'Queue the cause.',
    swatches: [['Background', '#E9EAEC'], ['Surface', '#F7F7F8'], ['Ink', '#121316', 'Text, tag edge, footer', '#E9EAEC'], ['Muted', '#585B62', null, '#E9EAEC'], ['5-ball orange', '#E4570F', 'Buttons (ink label)'], ['Price', '#B83D06', null, '#F7F7F8']],
    products: [P.hoodieBack, P.teeFront, P.hoodieFront, P.teeBack],
  },
  {
    key: 'cobalt', name: 'Cobalt', dot: '#1D3FCB',
    why: 'One loud colour across the whole site: the blue of the 2-ball, with white type. Every page is instantly recognisable as Clipbord, and both the cream and the black garments stand out against it. The boldest of the five.',
    hero: P.teeFront, headline: 'Four balls, one tee.',
    swatches: [['Background', '#1D3FCB'], ['Surface', '#152F9E'], ['Raised', '#12287F'], ['Text', '#F3F4F8', 'Text, buttons, tag edge', '#1D3FCB'], ['Muted', '#C3CCF1', null, '#1D3FCB'], ['Price', '#FFFFFF', null, '#152F9E']],
    products: [P.teeFront, P.hoodieBack, P.teeBack, P.hoodieFront],
  },
  {
    key: 'rack', name: 'Full rack', dot: '#D7263D',
    why: 'A slate base with the ADHD ball colours as a system. Each category hangs on its own ball colour (tees green, sweatshirts blue, joggers orange) and red does buttons and prices. Playful, and the colour tells you something.',
    hero: P.hoodieFront, headline: 'Pick a ball.',
    swatches: [['Background', '#121417'], ['Surface', '#1A1D21'], ['Text', '#EEF0F2', null, '#121417'], ['Muted', '#9AA0A8', null, '#121417'], ['Ball red', '#D7263D', 'Buttons (white label)'], ['Price', '#F2677A', null, '#1A1D21'], ['T-shirts', '#2E9E5B', 'Category'], ['Sweatshirts', '#2F6FDE', 'Category'], ['Joggers', '#F08A24', 'Category']],
    products: [P.hoodieFront, P.teeBack, P.joggers, P.teeFront],
    dots: { Tshirt: '#2E9E5B', 'Sweat Shirt': '#2F6FDE', Joggers: '#F08A24' },
  },
]

const chip = ([label, hex, note, on]) => `<div class="chip" style="--c:${hex}"><b></b><span><strong>${label}</strong><code>${hex}</code>${
  on ? `<em>${ratio(hex, on)} : 1 contrast</em>` : note ? `<em>${note}</em>` : ''}</span></div>`

const LOOP = `<svg class="loop" viewBox="0 0 20 62" aria-hidden="true"><path d="M8 62 L7.2 7 Q10 -2.2 12.8 7 L12 62"/></svg>`
const BOOKMARK = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10a1.5 1.5 0 0 1 1.5 1.5v15.5L12 16l-6.5 4.5V5A1.5 1.5 0 0 1 7 3.5z"/></svg>`
const BAG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>`
const tag = (p) => `<article class="hang" data-cat="${p.category}"><div class="swing">${LOOP}<div class="tag"><div class="face"><span class="eyelet"></span>
  <a href="#" class="photo" tabindex="-1" aria-hidden="true"><img src="${p.image}" alt="" loading="lazy" draggable="false"></a>
  <div class="title perf"><span class="cat">${LABELS[p.category]}</span><h5 class="name"><a href="#">${p.name}</a></h5></div>
  <div class="meta"><span class="mono" role="img" aria-label="Clipbord"></span><span class="vr"></span>
    <div><p class="price">${rupees(p.price)}</p><p class="tax">Incl. of all taxes</p></div>
    <button type="button" class="save" aria-pressed="false" aria-label="Save ${p.name} to wishlist">${BOOKMARK}</button></div>
</div></div></div></article>`

const filters = (pal) => ['All', 'T-shirt', 'Sweatshirt', 'Joggers'].map((f, i) => {
  const cat = Object.keys(LABELS).find((k) => LABELS[k] === f)
  const dot = pal.dots && cat ? `<i style="--dotc:${pal.dots[cat]}"></i>` : ''
  return `<span aria-pressed="${i === 0}">${dot}${f}</span>`
}).join('')

const site = (pal) => `<div class="site">
  <header class="nav"><span class="logo" role="img" aria-label="Clipbord"></span>
    <nav><a href="#" aria-current="page">Catalogue</a><a href="#">New drop</a><a href="#">About</a><a href="#">Wishlist</a></nav>
    <a href="#" class="bag" aria-label="Bag, 2 items">${BAG}<sup>2</sup></a></header>
  <div class="hero">
    <div class="hero-copy"><h3>${pal.headline}</h3>
      <p>Pool-hall prints on heavyweight tees and hoodies.</p>
      <div class="ctas"><a href="#" class="btn primary">Shop the drop</a><a href="#" class="btn ghost">Catalogue</a></div></div>
    <div class="hero-photo"><img src="${pal.hero.image}" alt="${pal.hero.name}" loading="lazy"></div>
  </div>
  <div class="shop"><div class="shop-head"><h4>New drop</h4><div class="filters">${filters(pal)}</div></div>
    <div class="rack">${pal.products.map(tag).join('')}</div></div>
  <footer class="foot"><div><p>Sizing, an order or a collab idea? Write to us.</p><a href="#">clipbord.in@gmail.com</a></div><small>© 2026 Clipbord</small></footer>

document.getElementById('jump').innerHTML = PALETTES.map((p, i) => `<a href="#${p.key}"><i style="--dot:${p.dot}"></i>${i + 1}. ${p.name}</a>`).join('')
document.getElementById('today').innerHTML = [['Ink', '#000000'], ['Smoke', '#111111'], ['Paper', '#F3EFE6'], ['Crimson', '#B3122E'], ['Crimson bright', '#E0475C']].map(chip).join('')
document.getElementById('palettes').innerHTML = PALETTES.map((p, i) => `
  <section class="palette p-${p.key}" id="${p.key}">
    <div class="p-head"><h2>${i + 1}. ${p.name}</h2><p class="why">${p.why}</p></div>

// The tag notches sit on the perforation under each photo.
function placeNotches() {
  document.querySelectorAll('.tag').forEach((t) => {
    const perf = t.querySelector('.perf')
    if (perf) t.style.setProperty('--seam', `${perf.offsetTop + 1.5}px`)
  })
}
new ResizeObserver(placeNotches).observe(document.body)
document.fonts.ready.then(placeNotches)

document.addEventListener('click', (e) => {
  const save = e.target.closest('.save')
  if (save) save.setAttribute('aria-pressed', save.getAttribute('aria-pressed') !== 'true')
  if (e.target.closest('a[href="#"]')) e.preventDefault()
})

// The swing from src/hooks/useSwing.js: a damped spring the pointer knocks.
const STIFFNESS = 60, DAMPING = 5.5, MAX_ANGLE = 6, MAX_SPEED = 60, NUDGE = 28, DRAG = 0.3
const clamp = (v, m) => Math.max(-m, Math.min(m, v))
function hang(area) {
  const el = area.querySelector('.swing')
  let angle = 0, speed = 0, frame = 0, last = 0
  function step(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30)
    last = now
    speed += (-STIFFNESS * angle - DAMPING * speed) * dt
    angle = clamp(angle + speed * dt, MAX_ANGLE)
    if (Math.abs(angle) < 0.02 && Math.abs(speed) < 0.05) { angle = 0; speed = 0; frame = 0; el.style.transform = ''; return }
    el.style.transform = `rotate(${angle}deg)`
    frame = requestAnimationFrame(step)
  }
  function push(a) { speed = clamp(speed + a, MAX_SPEED); if (!frame) { last = performance.now(); frame = requestAnimationFrame(step) } }
  area.addEventListener('pointerenter', (e) => {
    if (e.pointerType !== 'mouse') return
    const box = area.getBoundingClientRect()
    push(e.clientX < box.left + box.width / 2 ? -NUDGE : NUDGE)
  })
  area.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') push(-e.movementX * DRAG) })
}
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelectorAll('.hang').forEach(hang)
</script>
